name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - worktree-csharp-language-ext
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        run: |
          cd app
          npm ci || npm install

      # The in-browser C# runner (runner/) needs the .NET 11 SDK pinned in global.json
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('runner/Runner.csproj', 'analyzers/**/*.csproj', 'global.json') }}

      - name: Test exercise analyzer
        run: dotnet test analyzers/Jargon.Exercises.Analyzers.Tests

      - name: Build C# runner
        run: |
          cd app
          npm run build:runner

      - name: Build
        run: |
          cd app
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
